[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mimic"
version = "0.1.0"
description = "Modular inference for missingness, inconsistency, and creation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "joblib",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "torch",
]

[project.scripts]
mimic-data = "mimic.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ipykernel",
    "jupyter",
    "seaborn",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
