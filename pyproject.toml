[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mimic-tabular"
dynamic = ["version"]
description = "MIMIC Tabular: modular inference for missingness, inconsistency, and creation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fabrizio Costa" }]
keywords = [
    "tabular data",
    "missing data",
    "imputation",
    "synthetic data",
    "machine learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "joblib",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "torch",
    "tqdm",
]

[project.scripts]
mimic-data = "mimic.cli:main"

[project.urls]
Homepage = "https://github.com/fabriziocosta/MIMIC"
Documentation = "https://mimic-tabular.readthedocs.io/en/latest/"
Repository = "https://github.com/fabriziocosta/MIMIC"
Issues = "https://github.com/fabriziocosta/MIMIC/issues"
Changelog = "https://github.com/fabriziocosta/MIMIC/blob/master/CHANGELOG.md"
PyPI = "https://pypi.org/project/mimic-tabular/"

[project.optional-dependencies]
dev = [
    "pytest",
    "ipykernel",
    "jupyter",
    "seaborn",
    "scikit-posthocs",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "mimic._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
