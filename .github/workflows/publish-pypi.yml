name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish (for example, v0.1.2)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish distributions
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mimic-tabular/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag }}

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path

          tree = ast.parse(Path("src/mimic/_version.py").read_text())
          version = next(
              ast.literal_eval(node.value)
              for node in tree.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
          )
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"Release tag {actual!r} does not match package version {version!r}")
          print(f"Publishing {version}")
          PY

      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
